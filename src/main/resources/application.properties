spring.application.name=dota-assistant
# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080

# ==========================================
# DATABASE & FLYWAY CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/dota_assistant_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Налаштування міграцій Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Автоматичне створення/оновлення схеми БД через Hibernate (опціонально, при Flyway краще validate або none)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# SPRING AI (OPENAI) CONFIGURATION
# ==========================================
# Твій API ключ від OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:your-api-key-here}

# Базова модель для чату (можна змінити на gpt-4o або gpt-3.5-turbo)
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# Модель для створення ембедингів (потрібна для векторного пошуку RAG)
spring.ai.openai.embedding.options.model=text-embedding-3-small