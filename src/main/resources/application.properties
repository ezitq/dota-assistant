spring.application.name=dota-assistant
# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080

# ==========================================
# DATABASE & FLYWAY CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/dota_assistant_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Налаштування міграцій Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Автоматичне створення/оновлення схеми БД через Hibernate (опціонально, при Flyway краще validate або none)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# SPRING AI (OPENAI) CONFIGURATION
# ==========================================
# Твій API ключ від OpenAI
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
stratz.api.token=${STRATZ_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash
# Модель для створення ембедингів (потрібна для векторного пошуку RAG)
