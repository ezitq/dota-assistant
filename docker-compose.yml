version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dota_postgres_db
    environment:
      POSTGRES_DB: dota_assistant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: